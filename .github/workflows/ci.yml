name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  install-lint-build:
    name: Install, lint, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint (api + web)
        run: |
          pnpm --filter api lint
          pnpm --filter web lint

      - name: Generate Prisma client
        run: pnpm --filter api prisma:generate

      - name: Build (api + web)
        env:
          # apps/web's build needs a value here even though nothing in CI
          # calls the API — same placeholder used at runtime is fine, it's
          # only inlined into the client bundle.
          NEXT_PUBLIC_API_URL: http://localhost:3000
        run: |
          pnpm --filter api build
          pnpm --filter web build

      # Deploy-ready artifacts — not consumed by anything else in this
      # workflow (docker-build below rebuilds from source), but downloadable
      # from the run for a non-Docker manual deploy (see docs/DEPLOYMENT.md's
      # "Manual deployment" section) or for inspecting exactly what a given
      # commit would ship.
      - name: Upload api build artifact
        uses: actions/upload-artifact@v4
        with:
          name: api-dist
          path: |
            apps/api/dist
            apps/api/package.json
            apps/api/prisma
          retention-days: 14

      - name: Upload web build artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-standalone
          # Next.js's standalone output — the same three paths
          # apps/web/Dockerfile's runtime stage copies out of the build
          # stage, i.e. exactly what's needed to run `node server.js`.
          path: |
            apps/web/.next/standalone
            apps/web/.next/static
            apps/web/public
          retention-days: 14

  regression:
    name: Full verification suite
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: estateai
          POSTGRES_PASSWORD: estateai
          POSTGRES_DB: estateai
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U estateai -d estateai"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      NODE_ENV: test
      PORT: 3000
      HOST: 0.0.0.0
      DATABASE_URL: postgresql://estateai:estateai@localhost:5432/estateai?schema=public
      REDIS_HOST: localhost
      REDIS_PORT: 6379
      REDIS_DB: 0
      JWT_SECRET: ci-test-jwt-secret-at-least-32-characters-long
      CREDENTIAL_ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcd
      GITHUB_CLIENT_ID: ci-test-github-client-id
      GITHUB_CLIENT_SECRET: ci-test-github-client-secret
      GITHUB_CALLBACK_URL: http://localhost:3000/oauth/github/callback
      # Every verify script that needs a "provider" (GitHub, Claude,
      # OpenAI, Gemini) spins up its own local mock HTTP server and talks
      # to it via these overrides — the real vendor endpoints are never
      # called in CI, same convention documented in .env.example.
      GITHUB_TOKEN_URL: http://localhost:3999/token
      GITHUB_USER_URL: http://localhost:3999/user
      GITHUB_REPOS_URL: http://localhost:3999/user/repos
      GITHUB_ORGS_URL: http://localhost:3999/user/orgs
      CLAUDE_API_URL: http://localhost:3998/messages
      OPENAI_API_URL: http://localhost:3997/chat/completions
      GEMINI_API_URL: http://localhost:3996/models
      CLAUDE_API_KEY: ci-test-claude-key
      OPENAI_API_KEY: ci-test-openai-key
      GEMINI_API_KEY: ci-test-gemini-key
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client + run migrations
        working-directory: apps/api
        run: |
          pnpm prisma:generate
          pnpm prisma:deploy

      - name: Build
        working-directory: apps/api
        run: pnpm build

      - name: Start API server
        working-directory: apps/api
        run: |
          nohup node dist/server.js > /tmp/api.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://localhost:3000/health && exit 0
            sleep 1
          done
          echo "API server did not become healthy in time" >&2
          cat /tmp/api.log
          exit 1

      - name: Run full verification suite
        working-directory: apps/api
        run: |
          for script in $(node -e "console.log(Object.keys(require('./package.json').scripts).filter(s => s.startsWith('verify:')).join('\n'))"); do
            echo "::group::pnpm $script"
            pnpm "$script"
            echo "::endgroup::"
          done

      - name: Dump API server log on failure
        if: failure()
        run: cat /tmp/api.log

  docker-build:
    name: Build Docker images
    runs-on: ubuntu-latest
    needs: [install-lint-build]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build api image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          target: runtime
          push: false
          tags: estateai-api:ci

      - name: Build web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          target: runtime
          push: false
          tags: estateai-web:ci
          build-args: |
            NEXT_PUBLIC_API_URL=http://localhost:3000

[project]
name = "estateai-ai-service"
version = "0.1.0"
description = "EstateAI Python AI service — FastAPI + LangChain + LangGraph multi-agent layer"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "httpx>=0.27.0",
    "structlog>=24.4.0",
    "tenacity>=9.0.0",
    "redis>=5.1.0",
    "asyncpg>=0.30.0",
    "langchain>=0.3.7",
    "langchain-core>=0.3.15",
    "langchain-anthropic>=0.2.4",
    "langgraph>=0.2.45",
    "langgraph-checkpoint>=2.0.2",
    "langgraph-checkpoint-postgres>=2.0.0",
    "psycopg[binary,pool]>=3.2.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "respx>=0.21.1",
    "ruff>=0.7.0",
    "mypy>=1.13.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]
markers = ["integration: requires a real postgres + redis"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
ignore = [
    "B008",   # FastAPI Depends() in defaults
    "E501",   # long prose lines in prompts/docstrings
    "UP046", "UP047",  # pydantic v2 generics / explicit TypeVar
    "B017",   # a deliberate broad pytest.raises for config validation
]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
# Advisory only. Pydantic v2 populate-by-name aliases and LangChain's
# loosely-typed message unions produce false positives that are not worth
# suppressing inline one by one; the test suite is the correctness gate.
check_untyped_defs = false
disable_error_code = [
    "call-arg", "call-overload", "arg-type", "attr-defined", "assignment", "return-value", "misc", "union-attr", "list-item",
]

# Reverse proxy for the EstateAI production stack (docker-compose.prod.yml).
# Routes / to apps/web (Next.js), and /api-prefixed backend paths + /ws to
# apps/api. Fastify itself already sets its own security headers via
# @fastify/helmet — the headers below are the browser-facing ones a reverse
# proxy is expected to own regardless of what's behind it.

worker_processes auto;

events {
  worker_connections 1024;
}

http {
  include       mime.types;
  default_type  application/octet-stream;
  sendfile      on;
  keepalive_timeout 65;

  # Edge-level rate limiting (Phase 12) — defense in depth alongside
  # apps/api's own @fastify/rate-limit (RATE_LIMIT_MAX/RATE_LIMIT_WINDOW_MS).
  # Sized looser than the app-level default (1000/60s) since this bucket is
  # shared across every route including static frontend assets, not just
  # the API — it exists to blunt an abusive burst before it ever reaches
  # a container, not to be the primary throttle.
  limit_req_zone $binary_remote_addr zone=api_zone:10m rate=20r/s;
  limit_req_status 429;

  # Cache zone for Next.js's own content-hashed static assets
  # (/_next/static/...) — safe to cache aggressively since the filename
  # itself changes on every build. Nothing else is cached: API responses
  # are per-user/JWT-authenticated and the app shell HTML needs to stay
  # live, so this is deliberately narrow rather than a blanket proxy_cache.
  proxy_cache_path /var/cache/nginx/estateai levels=1:2 keys_zone=static_cache:10m max_size=200m inactive=7d use_temp_path=off;

  # Compression — text/JSON API responses and the Next.js build output both
  # benefit; already-compressed formats (images, fonts) are left alone.
  gzip on;
  gzip_comp_level 5;
  gzip_min_length 256;
  gzip_types
    application/json
    application/javascript
    text/css
    text/plain
    text/xml
    application/xml
    image/svg+xml;

  # WebSocket upgrade support (shared by the /ws location below) — nginx
  # doesn't do this automatically, Connection/Upgrade have to be forwarded
  # explicitly per the standard nginx WebSocket proxying recipe.
  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
  }

  upstream estateai_api {
    server api:3000;
  }

  upstream estateai_web {
    server web:3001;
  }

  server {
    listen 80;
    server_name _;

    # Security headers — same rationale as apps/api's @fastify/helmet:
    # belt-and-suspenders, since this is the edge every browser request
    # actually hits first.
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-XSS-Protection "1; mode=block" always;

    client_max_body_size 2m;

    # WebSocket upgrade — must come before the general /api location since
    # it's a more specific prefix match. Not rate-limited here: `limit_req`
    # governs new request bursts, not a single long-lived connection, and
    # apps/api's own JWT-based auth (Phase 10) is the real gate on /ws.
    location /ws {
      proxy_pass http://estateai_api;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Request-Id $request_id;
      # WebSocket connections are long-lived by design — the default
      # proxy_read_timeout (60s) would silently kill an idle-but-still-
      # subscribed connection.
      proxy_read_timeout 3600s;
      proxy_send_timeout 3600s;
    }

    # REST API + health/metrics — every non-frontend route this API
    # exposes (see docs/API_REFERENCE.md) is proxied through as-is; no
    # path rewriting, since apps/api's routes were never namespaced under
    # /api to begin with. `burst=40 nodelay` absorbs a short legitimate
    # spike (e.g. a page firing several requests at once) without queuing
    # requests behind the 20r/s steady-state rate.
    location ~ ^/(auth|categories|assets|tags|accounts|oauth|jobs|resources|analysis|policies|agents|ai|knowledge|copilot|health|metrics)(/|$) {
      limit_req zone=api_zone burst=40 nodelay;
      proxy_pass http://estateai_api;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Request-Id $request_id;
      proxy_set_header X-Correlation-Id $request_id;
    }

    # Next.js's own content-hashed static assets — long-lived, aggressive
    # caching is safe because the URL itself changes on every build.
    location /_next/static/ {
      proxy_pass http://estateai_web;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_cache static_cache;
      proxy_cache_valid 200 7d;
      add_header X-Cache-Status $upstream_cache_status always;
      add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # Everything else — the Next.js frontend (uncached, server-rendered /
    # session-dependent).
    location / {
      limit_req zone=api_zone burst=40 nodelay;
      proxy_pass http://estateai_web;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }
}
